name: Build Smerk3rVisuals

on:
  push:
    paths:
      - "Smerk3rVisuals/**"
      - ".github/workflows/smerk3rvisuals-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Smerk3rVisuals
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      - name: Build mod
        run: gradle build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Smerk3rVisuals-1.21.11
          path: Smerk3rVisuals/build/libs/*.jar
          if-no-files-found: error
